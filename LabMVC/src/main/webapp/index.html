<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MVC - Formulaire</title>
</head>
<body>
  <h2>Application MVC</h2>
  <form action="Controller" method="POST">
    Prénom : <input type="text" name="firstName" required><br><br>
    Nom : <input type="text" name="lastName" required><br><br>
    Date de naissance : <input type="text" name="birthDay" placeholder="mm/dd/yyyy" required><br><br>
    Sexe :
    <input type="radio" name="sex" value="Male" checked> Homme
    <input type="radio" name="sex" value="Female"> Femme<br><br>
    <input type="submit" value="Envoyer">
  </form>
</body>
</html>
