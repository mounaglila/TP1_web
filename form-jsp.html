<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Formulaire</title></head>
<body>
<h2>Formulaire (POST vers bean.jsp)</h2>
<form action="bean.jsp" method="POST">
  <p>Prénom : <input type="text" name="firstName"></p>
  <p>Nom : <input type="text" name="lastName"></p>
  <p>Date de naissance : <input type="text" name="birthDay" placeholder="mm/dd/yyyy"></p>
  <p>Sexe :
    <input type="radio" name="sex" value="Homme"> Homme
    <input type="radio" name="sex" value="Femme"> Femme
  </p>
  <input type="submit" value="Envoyer">
</form>
</body>
</html>
